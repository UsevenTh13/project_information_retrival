<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Thesaurus & IR Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <img src="{{ url_for('static', filename='UNRI NEW LOGO.png') }}" class="unri-logo" alt="UNRI Logo">
    <div class="background-animation"></div>

    <div class="container">
        <header>
            <div class="logo">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 17L12 22L22 17" stroke="#4facfe" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                    <path d="M2 12L12 17L22 12" stroke="#00f2fe" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                <h1>SEARCH ENGINE CNBC : KEUANGAN</h1>
            </div>
            <p class="subtitle">Powered by Untung, Harits, & Farhan</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Masukkan kata kunci (contoh: presiden)..."
                    autocomplete="off" />
                <button id="searchBtn">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M11 19C15.4183 19 19 15.4183 19 11C19 6.58172 15.4183 3 11 3C6.58172 3 3 6.58172 3 11C3 15.4183 6.58172 19 11 19Z"
                            stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        <path d="M20.9999 21L16.6499 16.65" stroke="white" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <div class="loader" id="loader" style="display: none;">
                <div class="spinner"></div>
                <p>Menganalisis Corpus & Metrik...</p>
            </div>

            <div class="error-msg" id="errorMsg" style="display: none;"></div>

            <div class="results-container" id="resultsContainer" style="display: none;">

                <!-- Metrics Dashboard -->
                <div class="metrics-dashboard">
                    <h3>Information Retrieval Metrics</h3>
                    <div class="metrics-grid">
                        <div class="metric-card">
                            <div class="metric-value" id="valPrecision">0%</div>
                            <div class="metric-label">Precision</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="valRecall">0%</div>
                            <div class="metric-label">Recall</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="valAccuracy">0%</div>
                            <div class="metric-label">Accuracy</div>
                        </div>
                        <div class="metric-card">
                            <div class="metric-value" id="valF1">0%</div>
                            <div class="metric-label">F1 Score</div>
                        </div>
                    </div>
                </div>

                <!-- Found Synonyms -->
                <div class="synonyms-box" id="synonymsBox">
                    <strong>Sinonim Word2Vec:</strong> <span id="synonymsList"></span>
                </div>

                <!-- Articles Result -->
                <div class="articles-header">
                    <h2>Hasil Berita untuk: <span id="targetWord" class="highlight"></span></h2>
                    <span class="count-badge" id="articleCount">0 Ditemukan</span>
                </div>

                <div class="articles-list" id="articlesList">
                    <!-- Articles will be injected here -->
                </div>
            </div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const searchInput = document.getElementById('searchInput');
            const searchBtn = document.getElementById('searchBtn');
            const loader = document.getElementById('loader');
            const errorMsg = document.getElementById('errorMsg');
            const resultsContainer = document.getElementById('resultsContainer');
            const articlesList = document.getElementById('articlesList');

            const performSearch = async () => {
                const word = searchInput.value.trim();
                if (!word) return;

                // Reset UI
                errorMsg.style.display = 'none';
                resultsContainer.style.display = 'none';
                loader.style.display = 'flex';
                articlesList.innerHTML = '';

                try {
                    const response = await fetch('/api/search', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ word })
                    });

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(data.error || 'Terjadi kesalahan saat menghubungi server.');
                    }

                    // Populate UI
                    document.getElementById('targetWord').textContent = word;

                    // Metrics
                    document.getElementById('valPrecision').textContent = data.metrics.precision + '%';
                    document.getElementById('valRecall').textContent = data.metrics.recall + '%';
                    document.getElementById('valAccuracy').textContent = data.metrics.accuracy + '%';
                    document.getElementById('valF1').textContent = data.metrics.f1_score + '%';

                    // Synonyms
                    const synBox = document.getElementById('synonymsBox');
                    if (data.synonyms && data.synonyms.length > 0) {
                        document.getElementById('synonymsList').textContent = data.synonyms.join(', ');
                        synBox.style.display = 'block';
                    } else {
                        synBox.style.display = 'none';
                    }

                    // Articles
                    document.getElementById('articleCount').textContent = data.results.length + ' Ditemukan';

                    if (data.results.length === 0) {
                        articlesList.innerHTML = '<div class="no-results">Tidak ada berita yang relevan ditemukan.</div>';
                    } else {
                        data.results.forEach((article, index) => {
                            const card = document.createElement('div');
                            card.className = 'article-card';
                            card.style.animationDelay = `${index * 0.05}s`;

                            card.innerHTML = `
                                <div class="article-header" onclick="this.parentElement.classList.toggle('active')">
                                    <div style="display:flex; align-items: center; justify-content: space-between; width: 100%;">
                                        <h4 style="margin: 0; font-size: 1.05rem;">${article.title}</h4>
                                        <span class="score-badge">Skor: ${article.score}</span>
                                    </div>
                                    <div class="dropdown-icon">▼</div>
                                </div>
                                <div class="article-body">
                                    <p class="snippet">${article.text}</p>
                                </div>
                            `;
                            articlesList.appendChild(card);
                        });
                    }

                    resultsContainer.style.display = 'block';

                } catch (error) {
                    errorMsg.textContent = error.message;
                    errorMsg.style.display = 'block';
                } finally {
                    loader.style.display = 'none';
                }
            };

            searchBtn.addEventListener('click', performSearch);
            searchInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    performSearch();
                }
            });
        });
    </script>
</body>

</html>
